# Reads what the live server tells a brand-new install (plan, allowance,
# plan locks), for checks after a server change, and times one meal photo
# estimate as the review account. Nothing else is written.
name: Server probe

on:
  workflow_dispatch:
    inputs:
      watch_minutes:
        description: 'Also watch a redeploy: poll /health and keep scanning meals for this many minutes (0 = off)'
        default: '0'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: A new install's entitlement
        run: |
          ref="u_probe_$(date +%s)"
          curl -sS -m 30 -H "x-calgym-user: $ref" https://calapp-production-ab20.up.railway.app/api/me | tee me.json
          echo
          python3 -c "import json;d=json.load(open('me.json'));print('PROBE', json.dumps({k:d.get(k) for k in ['plan','remaining','limit','planLocks','locks','features']}))"
      - name: Health and one AI reply
        run: |
          curl -sS -m 30 https://calapp-production-ab20.up.railway.app/health; echo
          ref="u_probe_ai_$(date +%s)"
          curl -sS -m 90 -H "x-calgym-user: $ref" -H 'content-type: application/json' \
            -d '{"language":"en","messages":[{"role":"user","content":"Reply with the single word OK."}]}' \
            -w '\nHTTP %{http_code}\n' https://calapp-production-ab20.up.railway.app/api/coach
      - name: One meal photo estimate, timed (review account)
        env:
          REVIEW_CODE: ${{ secrets.REVIEW_CODE }}
        run: |
          SB=https://uvhvxcvwpwkqvnvqdtyf.supabase.co
          KEY=sb_publishable_No3nDw01Bu7U5l2m5k_pnA_zYxl919V
          python3 - <<'PY' > login.json
          import json, os
          print(json.dumps({"email": "review@calgym.org", "password": os.environ["REVIEW_CODE"]}))
          PY
          curl -sS -m 30 -H "apikey: $KEY" -H 'content-type: application/json' -d @login.json "$SB/auth/v1/token?grant_type=password" > session.json
          TOKEN=$(python3 -c "import json;print(json.load(open('session.json')).get('access_token',''))")
          [ -n "$TOKEN" ] || { echo "sign-in failed"; python3 -c "import json;d=json.load(open('session.json'));print({k:d.get(k) for k in ['error','error_code','msg']})"; exit 1; }
          echo "$TOKEN" > token.txt
          cp qa/fixtures/meal.jpg meal.jpg
          ls -l meal.jpg
          for lang in en ar; do
            python3 -c "import base64,json,sys;print(json.dumps({'image':base64.b64encode(open('meal.jpg','rb').read()).decode(),'language':sys.argv[1]}))" "$lang" > body.json
            ref="u_probe_meal_$(date +%s)"
            curl -sS -m 200 -H "x-calgym-user: $ref" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              -d @body.json -o meal.json -w "MEAL $lang HTTP %{http_code} in %{time_total}s\n" https://calapp-production-ab20.up.railway.app/api/analyze-meal || echo "MEAL $lang curl failed ($?)"
            head -c 600 meal.json; echo
          done
      - name: Watch a redeploy (health every 3 s, meal scans back to back)
        if: ${{ inputs.watch_minutes != '0' }}
        env:
          MINUTES: ${{ inputs.watch_minutes }}
        run: |
          URL=https://calapp-production-ab20.up.railway.app
          end=$(( $(date +%s) + MINUTES * 60 ))
          ( last=""; while [ $(date +%s) -lt $end ]; do
              out=$(curl -sS -m 10 -w ' %{http_code}' $URL/health 2>&1 | tail -c 200)
              code=${out##* }; commit=$(echo "$out" | grep -o '"commit":"[0-9a-f]*"')
              now="$code $commit"; [ "$now" != "$last" ] && echo "$(date -u +%T) HEALTH $now"; last=$now; sleep 3
            done ) &
          n=0; while [ $(date +%s) -lt $end ]; do
            n=$((n+1)); python3 -c "import base64,json;print(json.dumps({'image':base64.b64encode(open('meal.jpg','rb').read()).decode(),'language':'en'}))" > body.json
            curl -sS -m 150 -H "x-calgym-user: u_probe_watch_$(date +%s)" -H "Authorization: Bearer $(cat token.txt)" -H 'content-type: application/json' \
              -d @body.json -o scan.json -w "$(date -u +%T) SCAN $n HTTP %{http_code} in %{time_total}s\n" $URL/api/analyze-meal || echo "SCAN $n curl failed"
          done
          wait
