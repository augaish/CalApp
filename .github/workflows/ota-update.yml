# Over-the-air JS updates: ships instantly to installed apps via EAS Update —
# no App Store / Play review needed for JS/asset changes.
#
# Publishes to BOTH channels so every tester is covered:
#   • production → the iOS TestFlight build
#   • preview    → the Android APK (from android-build.yml)
# Manual runs can target just one channel via the "channel" input.
name: OTA Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel(s) to update'
        type: choice
        default: both
        options: [both, production, preview]

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: EAS Update (production channel)
        if: ${{ github.event_name == 'push' || inputs.channel == 'both' || inputs.channel == 'production' }}
        run: eas update --channel production --message "${{ github.event.head_commit.message || format('Manual OTA update ({0})', github.sha) }}" --non-interactive
      - name: EAS Update (preview channel)
        if: ${{ github.event_name == 'push' || inputs.channel == 'both' || inputs.channel == 'preview' }}
        run: eas update --channel preview --message "${{ github.event.head_commit.message || format('Manual OTA update ({0})', github.sha) }}" --non-interactive
