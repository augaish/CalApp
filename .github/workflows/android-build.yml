# Android test build: produces a directly-installable APK in the EAS cloud and
# prints its download link in the run log — share that link with an Android
# tester (no Google Play needed). Trigger manually from the Actions tab.
#
# NOTE: the `preview` profile uses the `preview` EAS environment. Make sure
# EXPO_PUBLIC_API_URL is set there (copy it from production), otherwise the
# build runs in demo mode with mocked AI results.
name: Android Build (APK)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        default: preview
        options: [preview, production]

jobs:
  build:
    name: EAS build (Android APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # No --no-wait: waiting lets EAS hand back the finished build. --json
      # gives its page and APK link, posted as notes on the run so they can
      # be read without opening the log.
      - run: >-
          eas build
          --platform android
          --profile ${{ github.event.inputs.profile || 'preview' }}
          --non-interactive
          --json > build.json
      - run: |
          page="https://expo.dev/accounts/$(jq -r '.[0].project.ownerAccount.name // "augaishb"' build.json)/projects/calapp/builds/$(jq -r '.[0].id' build.json)"
          apk=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' build.json)
          echo "::notice title=Build page::$page"
          [ -n "$apk" ] && echo "::notice title=Download (APK for testers, AAB for Google Play)::$apk"
          echo "Share the build page with your Android tester: open it on the phone and tap Install."
