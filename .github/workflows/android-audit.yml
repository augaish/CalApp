# Opens the Android test app on an emulator with sample data and takes a
# screenshot of each main screen, in English and Arabic (qa/android-audit).
# The app picks up the latest preview update before the screenshots.
name: Android audit (emulator)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Test app (preview APK) to install'
        type: string
        default: 'https://expo.dev/artifacts/eas/XRebYAbEZGxJKI0aU-KdaLrpBcJl99jzdnSDervD0FA.apk'
      only:
        description: 'Only screens whose name matches this pattern (empty: all)'
        type: string
        default: ''
      langs:
        description: 'Languages'
        type: string
        default: 'en ar'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the test app
        run: curl -fsSL -o app.apk "${{ github.event.inputs.apk_url }}"
      - name: Screens on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ONLY='${{ github.event.inputs.only }}' LANGS='${{ github.event.inputs.langs }}' bash qa/android-audit/run.sh app.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-audit
          path: shots
      # Small copies go into the repo (qa/android-audit/shots/<run>), where
      # they can be read without the artifact download.
      - name: Commit small copies
        if: always()
        run: |
          pip install --quiet pillow
          dest=qa/android-audit/shots/${{ github.run_number }}
          python3 qa/android-audit/pack.py shots "$dest"
          cp shots/logcat.txt "$dest/" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "Android audit screenshots (run ${{ github.run_number }})"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
